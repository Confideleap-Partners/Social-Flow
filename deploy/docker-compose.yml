name: social-flow-${DEPLOY_ENV}

services:
  app:
    image: ${IMAGE_TAG}
    command:
      [
        'sh',
        '-c',
        'nginx && (pm2 delete all || true) && pnpm run --parallel pm2 && pm2 logs',
      ]
    env_file: .env
    environment:
      NODE_ENV: production
      # OAuth providers build their callback URLs from FRONTEND_URL. Keep all
      # public Postiz URLs tied to the Traefik host instead of allowing a stale
      # Infisical value (for example, the SocialFlow product frontend) to send
      # provider callbacks to the wrong application.
      MAIN_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set}
      FRONTEND_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set}
      NEXT_PUBLIC_BACKEND_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set}/api
      DATABASE_URL: ${POSTIZ_DATABASE_URL:?POSTIZ_DATABASE_URL must be set}
      # Same defaults the hand-started stack used; a value in Infisical (the .env file) still wins.
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://127.0.0.1:3000}
      IS_GENERAL: ${IS_GENERAL:-true}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      REDIS_URL: ${POSTIZ_REDIS_URL:-redis://postiz-redis:6379}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
    init: true
    restart: unless-stopped
    ports:
      - '${APP_PORT:-4007}:5000'
    volumes:
      - uploads:/uploads
      - config:/config
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "Promise.all(['http://localhost:5000/', 'http://localhost:5000/api/monitor/queue/health', 'http://localhost:3002/health/status'].map(url => fetch(url).then(r => { if (!r.ok) throw new Error(url) }))).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    networks:
      - postiz
      - temporal
      - traefik-public
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-public'
      - 'traefik.http.routers.social-flow-${DEPLOY_ENV}.rule=Host(`${APP_DOMAIN}`)'
      - 'traefik.http.routers.social-flow-${DEPLOY_ENV}.tls=true'
      - 'traefik.http.routers.social-flow-${DEPLOY_ENV}.entrypoints=websecure'
      - 'traefik.http.services.social-flow-${DEPLOY_ENV}.loadbalancer.server.port=5000'

volumes:
  config:
    external: true
    name: ${POSTIZ_CONFIG_VOLUME:?POSTIZ_CONFIG_VOLUME must be set (deploy/discover-infra.sh finds it)}
  uploads:
    external: true
    name: ${POSTIZ_UPLOADS_VOLUME:?POSTIZ_UPLOADS_VOLUME must be set (deploy/discover-infra.sh finds it)}

networks:
  postiz:
    external: true
    name: ${POSTIZ_NETWORK:?POSTIZ_NETWORK must be set (deploy/discover-infra.sh finds it)}
  temporal:
    external: true
    name: ${TEMPORAL_NETWORK:?TEMPORAL_NETWORK must be set (deploy/discover-infra.sh finds it)}
  traefik-public:
    external: true
