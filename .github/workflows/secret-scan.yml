name: Secret Scan

on:
  push:
    branches: [dev, uat, main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch GITLEAKS_LICENSE from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          oidc-audience: https://github.com/Confideleap-Partners
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: social-flow
          # env follows the target branch: main -> prod, uat -> uat, anything else -> dev
          env-slug: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || (github.base_ref || github.ref_name) == 'uat' && 'uat' || 'dev' }}
          secret-path: /ci
          secret-name: GITLEAKS_LICENSE
          domain: https://infisical.confideleap.com

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ env.GITLEAKS_LICENSE }}
